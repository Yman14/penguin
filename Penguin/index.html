<!DOCTYPE html>
<html>
    <head>
        <title>Penguin</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="penguin-portrait">
            <div class="penguin-head">
                <div class="head"></div>
                <div class="left-face">
                    <div class="left-eye">
                        <div class="left-inner-eye"></div>
                    </div>
                </div>
                <div class="right-face">
                    <div class="right-eye">
                        <div class="right-inner-eye"></div>
                    </div>
                </div>
                <div class="mouth">
                    <div class="upper-lip"></div>
                    <div class="lower-lip"></div>
                    <div class="upper-inner-lip"></div>
                    <div class="lower-inner-lip"></div>
                </div>
            </div>
            <div class="penguin-body"></div>
                <div class="main-body">
                    <div class="inner-body"></div>
                </div>
            <div class="penguin-hands">
                <div class="left-hand"></div>
                <div class="right-hand"></div>
            </div>

            <div class="penguin-feets"></div>
                <div class="left-feet"></div>
                <div class="right-feet"></div>
        </div>
    </body>
</html>
